<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Update Employee</title>
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
		integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
	crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
  <!-- Brand -->
  <a class="navbar-brand" href="#">Employee Management System</a>

  <!-- Toggler/collapsibe Button -->
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- Navbar links -->
  <div class="collapse navbar-collapse" id="collapsibleNavbar">
    <ul class="navbar-nav">
      <li class="nav-item">
      </li>
    </ul>
  </div>
</nav>
<br>
<br>
	<div class = "container">
		<div class = "row">
			<div class ="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
				<h1 class = "text-center"> Edit your Details </h1>
				<div class = "card-body">
    <form th:action="@{/updateId/{id} (id=${emp.id})}" method="get" th:object="${emp}">
						<div class ="form-group">
							<label style="color: rgb(0, 255, 0); font-size: 20px;"> Employee Id  </label>
							<input
							type = "text"
							name = "Emp Id"
							th:field = "*{id}"
							class = "form-control"
							placeholder="Enter Your Id" 
							/>
						</div>
						
						<div class ="form-group">
							<label style="color: rgb(0, 255, 0); font-size: 20px;"> Employee Name </label>
							<input
							type = "text"
							name = "Name"
							th:field = "*{name}"
							class = "form-control"
							placeholder="Enter Your Name" 
							/>
						</div>
						<div class ="form-group">
							<label style="color: rgb(0, 128, 0); font-size: 20px;"	> Employee Address </label>
							<input
							type = "text"
							name = "Address"
							th:field = "*{address}"
							class = "form-control"
							placeholder="Enter your Address" 
							/>
						</div>
						
						<div class ="form-group">
							<label style="color: rgb(0, 255, 0); font-size: 20px;"	>  Email </label>
							<input
							type = "text"
							name = "email"
							th:field = "*{email}"
							class = "form-control"
							placeholder="Enter Valid Email" 
							/>
						</div>
						<div class ="form-group">
							<label style="color: rgb(0, 255, 0); font-size: 20px;" > Mobile NUmber </label>
					
							<input
							type = "text"
							name = "Phone Num"
							th:field = "*{contact}"
							class = "form-control"
							
							placeholder="Enter Correct number" 
							/>
						</div>
						
						<div class = "box-footer">
							<button type="submit" class = "btn btn-primary">
								Submit
							</button>
						</div>
					</form>
				
				</div>
			</div>
		</div>
	</div>
</body>
</html>
